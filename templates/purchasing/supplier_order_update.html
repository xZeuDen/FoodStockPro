{% extends "base.html" %}

{% block title %}Supplier Order Update | FoodStockPro{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="mb-3">Supplier Order Update</h1>
                <p class="text-muted">
                    Update PO-{{ purchase_order.id }}. Suppliers can accept, cancel, or mark an order as delivered.
                </p>

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-success btn-lg" type="submit">Save</button>
                    <a class="btn btn-outline-secondary btn-lg" href="{% url 'purchasing:purchase_order_detail' purchase_order.pk %}">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
